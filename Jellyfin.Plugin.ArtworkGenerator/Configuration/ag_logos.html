<div id="AgLogosPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/ag_logos.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="AgLogosForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Logo Designs</h1>
                    </div>

                    <!-- Logo Selector -->
                    <div class="jpk-selector">
                        <select is="emby-select" id="selectLogo" class="jpk-selector-dropdown" aria-label="Logo design"></select>
                        <div class="jpk-selector-actions">
                            <button is="emby-button" type="button" id="btnRenameLogo" class="raised jpk-icon-btn" title="Rename">
                                <span class="material-icons" aria-hidden="true">edit</span>
                                <span class="jpk-icon-btn-label">Rename</span>
                            </button>
                            <button is="emby-button" type="button" id="btnNewLogo" class="raised jpk-icon-btn button-submit" title="New">
                                <span class="material-icons" aria-hidden="true">add</span>
                                <span class="jpk-icon-btn-label">New</span>
                            </button>
                            <button is="emby-button" type="button" id="btnDeleteLogo" class="raised jpk-icon-btn button-delete" title="Delete">
                                <span class="material-icons" aria-hidden="true">delete</span>
                                <span class="jpk-icon-btn-label">Delete</span>
                            </button>
                        </div>
                    </div>

                    <!-- Live Preview: same shape as the Designs page, so both read the same way -->
                    <div class="jpk-section poster-preview-section">
                        <div class="jpk-section-title">Live Preview</div>
                        <div class="jpk-section-content">
                            <div class="poster-preview-layout">
                                <div class="poster-preview-main">
                                    <div id="logoPreviewFrame" class="logo-preview-frame">
                                        <img id="logoPreviewImage" class="logo-preview-image" alt="Live logo preview" />
                                        <div id="logoPreviewStatus" class="poster-preview-status">Loading preview…</div>
                                    </div>
                                    <div class="poster-preview-caption">
                                        <button is="emby-button" type="button" id="btnToggleLogoBackground" class="raised">
                                            <span>Light Background</span>
                                        </button>
                                    </div>
                                    <div class="inputContainer poster-preview-kind">
                                        <label for="txtSampleName">Sample Name:</label>
                                        <input is="emby-input" type="text" id="txtSampleName" placeholder="Star Wars: Andor" />
                                        <div class="fieldDescription">A name to preview with. It is not saved, so try the names your own shows have.</div>
                                    </div>
                                </div>
                                <div class="poster-preview-components" id="logoColorSourceRow" style="display: none;">
                                    <div class="poster-component" id="logoColorSourceComponent">
                                        <img class="poster-component-img" id="logoColorSourceImage" src="" alt="Artwork the colour is sampled from" />
                                        <span class="poster-component-label" id="logoColorSourceLabel"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Text -->
                    <div class="jpk-section">
                        <div class="jpk-section-title">Text</div>
                        <div class="jpk-section-content">
                            <div class="inputContainer">
                                <label for="selectTitleSource"></label>
                                <select is="emby-select" id="selectTitleSource" data-setting="TitleSource" data-default="Title"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkStripYear" data-setting="StripYear" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectSubtitleMode"></label>
                                <select is="emby-select" id="selectSubtitleMode" data-setting="SubtitleMode" data-default="Keep"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer" id="secondarySizeContainer">
                                <label for="txtSecondarySize"></label>
                                <input is="emby-input" type="number" id="txtSecondarySize" min="20" max="90" step="5" data-setting="SecondarySize" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtCustomRegex"></label>
                                <input is="emby-input" type="text" id="txtCustomRegex" placeholder="^The\s+" data-setting="CustomRegex" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkUppercase" data-setting="Uppercase" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                            </div>

                            <div class="inputContainer">
                                <label for="selectMaxLines"></label>
                                <select is="emby-select" id="selectMaxLines" data-setting="MaxLines" data-default="2" data-type="number"></select>
                                <div class="fieldDescription"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Font -->
                    <div class="jpk-collapsible-section">
                        <button type="button" class="jpk-collapsible-header collapsed" aria-expanded="false" aria-controls="logoFontContent" data-target="logoFontContent">
                            <span class="jpk-collapsible-title">Font</span>
                            <span class="jpk-collapsible-icon">&#9660;</span>
                        </button>
                        <div id="logoFontContent" class="jpk-collapsible-content collapsed">
                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkLogoUseCustomFont" data-setting="UseCustomFont" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer" data-depends-on="chkLogoUseCustomFont">
                                <label for="txtLogoFontPath"></label>
                                <input is="emby-input" type="text" id="txtLogoFontPath" placeholder="/path/to/font.ttf" data-setting="FontPath" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div data-hide-when-checked="chkLogoUseCustomFont">
                                <div class="inputContainer">
                                    <label for="selectLogoFontFamily"></label>
                                    <select is="emby-select" id="selectLogoFontFamily" data-setting="FontFamily" data-default="Arial">
                                        <option value="Arial">Arial</option>
                                    </select>
                                </div>
                                <div class="inputContainer">
                                    <label for="selectLogoFontStyle"></label>
                                    <select is="emby-select" id="selectLogoFontStyle" data-setting="FontStyle" data-default="Bold"></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Color -->
                    <div class="jpk-collapsible-section">
                        <button type="button" class="jpk-collapsible-header collapsed" aria-expanded="false" aria-controls="logoColorContent" data-target="logoColorContent">
                            <span class="jpk-collapsible-title">Color</span>
                            <span class="jpk-collapsible-icon">&#9660;</span>
                        </button>
                        <div id="logoColorContent" class="jpk-collapsible-content collapsed">
                            <div class="inputContainer">
                                <label for="selectLogoFill"></label>
                                <select is="emby-select" id="selectLogoFill" data-setting="Fill" data-default="Color"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer" data-hide-for-fill="Photo">
                                <label for="selectColorSource"></label>
                                <select is="emby-select" id="selectColorSource" data-setting="ColorSource" data-default="Fixed"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer" data-hide-for-fill="Photo">
                                <label for="txtLogoColor" class="color-control-label" data-color-label="Text Color:" data-opacity-label="Text Opacity:">Text Color:</label>
                                <div class="color-control-group">
                                    <input type="color" id="colorLogoColor" class="color-picker" />
                                    <input type="range" id="alphaLogoColor" class="alpha-slider" min="0" max="255" value="255" />
                                    <span class="alpha-label">255</span>
                                    <input is="emby-input" type="text" id="txtLogoColor" placeholder="#FFFFFFFF" data-setting="Color" class="hex-input" />
                                </div>
                                <div id="descLogoColor" class="fieldDescription" data-color-desc="ARGB hex color for the text." data-opacity-desc="How solid the sampled color is drawn, 0 to 255. The color itself comes from the series artwork, and this color is only used if that artwork cannot be read.">ARGB hex color for the text.</div>
                            </div>

                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkLogoOutline" data-setting="OutlineEnabled" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                            </div>

                            <div class="nested-settings" data-depends-on="chkLogoOutline">
                                <div class="inputContainer">
                                    <label for="txtLogoOutlineColor"></label>
                                    <div class="color-control-group">
                                        <input type="color" id="colorLogoOutlineColor" class="color-picker" />
                                        <input type="range" id="alphaLogoOutlineColor" class="alpha-slider" min="0" max="255" value="255" />
                                        <span class="alpha-label">255</span>
                                        <input is="emby-input" type="text" id="txtLogoOutlineColor" placeholder="#FF000000" data-setting="OutlineColor" class="hex-input" />
                                    </div>
                                </div>
                                <div class="inputContainer">
                                    <label for="txtLogoOutlineWidth"></label>
                                    <input is="emby-input" type="number" id="txtLogoOutlineWidth" min="0" max="20" step="0.5" data-setting="OutlineWidth" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkLogoShadow" data-setting="ShadowEnabled" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Size -->
                    <div class="jpk-collapsible-section">
                        <button type="button" class="jpk-collapsible-header collapsed" aria-expanded="false" aria-controls="logoSizeContent" data-target="logoSizeContent">
                            <span class="jpk-collapsible-title">Size</span>
                            <span class="jpk-collapsible-icon">&#9660;</span>
                        </button>
                        <div id="logoSizeContent" class="jpk-collapsible-content collapsed">
                            <div class="inputContainer">
                                <label for="txtLogoWidth"></label>
                                <input is="emby-input" type="number" id="txtLogoWidth" min="100" max="4000" step="1" data-setting="Width" data-type="number" />
                            </div>
                            <div class="inputContainer">
                                <label for="txtLogoHeight"></label>
                                <input is="emby-input" type="number" id="txtLogoHeight" min="40" max="2000" step="1" data-setting="Height" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Save -->
                    <div class="inputContainer">
                        <button is="emby-button" type="submit" data-theme="b" class="raised button-submit block">
                            <span>Save</span>
                        </button>
                        <span id="unsavedIndicator" class="jpk-unsaved">
                            <span class="jpk-unsaved-dot"></span>
                            Unsaved changes
                        </span>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- Input Modal -->
    <div id="inputModal" class="jpk-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="inputModalTitle">
        <div class="jpk-dialog-content jpk-dialog-content-narrow">
            <button type="button" id="btnCloseInputModal" class="jpk-dialog-close" aria-label="Close">&times;</button>
            <h2 id="inputModalTitle" class="jpk-modal-title"></h2>
            <div class="jpk-modal-body">
                <div id="inputModalFields"></div>
            </div>
            <div class="jpk-modal-button-row">
                <button is="emby-button" type="button" id="btnCancelInputModal" class="raised jpk-modal-button">
                    <span>Cancel</span>
                </button>
                <button is="emby-button" type="button" id="btnConfirmInputModal" class="raised button-submit jpk-modal-button">
                    <span>OK</span>
                </button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=ag_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=ag_shared.css">
</div>
