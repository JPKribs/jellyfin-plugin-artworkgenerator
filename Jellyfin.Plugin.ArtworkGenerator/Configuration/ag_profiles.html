<div id="AgProfilesPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/ag_profiles.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="AgProfilesForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Profiles</h1>
                    </div>

                    <!-- Profile Selector -->
                    <div class="base-selector">
                        <select is="emby-select" id="selectProfile" class="base-selector-dropdown" aria-label="Profile"></select>
                        <div class="base-selector-actions">
                            <button is="emby-button" type="button" id="btnNewProfile" class="raised base-button primary" title="New">
                                <span class="material-icons" aria-hidden="true">add</span>
                                <span>New</span>
                            </button>
                            <button is="emby-button" type="button" id="btnRenameProfile" class="raised base-button secondary" title="Rename">
                                <span class="material-icons" aria-hidden="true">edit</span>
                                <span>Rename</span>
                            </button>
                            <button is="emby-button" type="button" id="btnDeleteProfile" class="raised base-button destructive" title="Remove">
                                <span class="material-icons" aria-hidden="true">delete</span>
                                <span>Remove</span>
                            </button>
                        </div>
                    </div>

                    <!-- Assignment -->
                    <div id="assignmentSection" class="hidden">
                        <div id="assignmentBlocks"></div>
                        <div class="fieldDescription">Pick the series and films this profile draws. Anything not picked uses the default profile.</div>
                        <div id="assignmentStatus" class="base-status-text" role="status"></div>
                    </div>

                    <!-- Images -->
                    <div class="base-section">
                        <div class="base-section-title">Images</div>
                        <div class="base-section-content">
                            <div id="slotMatrix" class="ag-slot-matrix"></div>
                        </div>
                    </div>

                    <!-- Backdrops -->
                    <div class="base-section">
                        <div class="base-section-title">Backdrops</div>
                        <div id="backdropContent" class="base-section-content">

                            <div class="inputContainer">
                                <label for="txtBackdropRatio"></label>
                                <input is="emby-input" type="text" id="txtBackdropRatio" placeholder="16:9" data-backdrop-setting="AspectRatio" />
                                <div class="fieldDescription"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Save -->
                    <div class="inputContainer">
                        <button is="emby-button" type="submit" class="raised base-button primary fill">
                            <span>Save</span>
                        </button>
                        <span id="unsavedIndicator" class="base-unsaved">
                            <span class="base-unsaved-dot"></span>Unsaved
                        </span>
                        <div id="saveStatus" class="base-status-text" role="status"></div>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=ag_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=ag_shared.css">
</div>
