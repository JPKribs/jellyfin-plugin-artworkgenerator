<div id="AgProfilesPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/ag_profiles.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="AgProfilesForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Profiles</h1>
                    </div>

                    <!-- Profile Selector -->
                    <div class="jpk-selector">
                        <select is="emby-select" id="selectProfile" class="jpk-selector-dropdown" aria-label="Profile"></select>
                        <div class="jpk-selector-actions">
                            <button is="emby-button" type="button" id="btnRenameProfile" class="raised jpk-icon-btn" title="Rename">
                                <span class="material-icons" aria-hidden="true">edit</span>
                                <span class="jpk-icon-btn-label">Rename</span>
                            </button>
                            <button is="emby-button" type="button" id="btnNewProfile" class="raised jpk-icon-btn" title="New">
                                <span class="material-icons" aria-hidden="true">add</span>
                                <span class="jpk-icon-btn-label">New</span>
                            </button>
                            <button is="emby-button" type="button" id="btnDeleteProfile" class="raised jpk-icon-btn button-delete" title="Delete">
                                <span class="material-icons" aria-hidden="true">delete</span>
                                <span class="jpk-icon-btn-label">Delete</span>
                            </button>
                        </div>
                    </div>

                    <!-- Series Assignment -->
                    <div id="assignmentSection" style="display: none; margin-bottom: 1.5em;">
                        <div id="assignmentBlocks"></div>
                        <div class="fieldDescription">Pick the series and films this profile draws. Anything not picked uses the default profile.</div>
                    </div>

                    <!-- Images -->
                    <div class="jpk-section">
                        <div class="jpk-section-title">Images</div>
                        <div class="jpk-section-content">
                            <div id="slotMatrix" class="slot-matrix"></div>
                        </div>
                    </div>

                    <!-- Backdrops -->
                    <div class="jpk-section">
                        <div class="jpk-section-title">Backdrops</div>
                        <div id="backdropContent" class="jpk-section-content">

                            <div class="inputContainer">
                                <label for="txtBackdropRatio"></label>
                                <input is="emby-input" type="text" id="txtBackdropRatio" placeholder="16:9" data-backdrop-setting="AspectRatio" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="checkboxContainer">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkBackdropLetterbox" data-backdrop-setting="EnableLetterboxDetection" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="nested-settings" id="backdropLetterboxOptions">
                                <div class="inputContainer">
                                    <label for="txtBackdropBlack"></label>
                                    <input is="emby-input" type="number" id="txtBackdropBlack" min="0" max="255" data-backdrop-setting="LetterboxBlackThreshold" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="txtBackdropConfidence"></label>
                                    <input is="emby-input" type="number" id="txtBackdropConfidence" min="50" max="100" step="1" data-backdrop-setting="LetterboxConfidence" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtBackdropBrighten"></label>
                                <input is="emby-input" type="number" id="txtBackdropBrighten" min="0" max="100" data-backdrop-setting="BrightenHDR" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtBackdropStart"></label>
                                <input is="emby-input" type="number" id="txtBackdropStart" min="0" max="100" step="1" data-backdrop-setting="ExtractWindowStart" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtBackdropEnd"></label>
                                <input is="emby-input" type="number" id="txtBackdropEnd" min="0" max="100" step="1" data-backdrop-setting="ExtractWindowEnd" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Save -->
                    <div class="inputContainer">
                        <button is="emby-button" type="submit" data-theme="b" class="raised button-submit block">
                            <span>Save</span>
                        </button>
                        <span id="unsavedIndicator" class="jpk-unsaved">
                            <span class="jpk-unsaved-dot"></span>
                            Unsaved changes
                        </span>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- Series Selection Modal -->
    <div id="pickerModal" class="jpk-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <div class="jpk-dialog-content picker-content">
            <button type="button" id="btnClosePicker" class="jpk-dialog-close" aria-label="Close">&times;</button>
            <h2 id="pickerTitle" class="jpk-modal-title">Select Series</h2>
            <div class="picker-search">
                <input is="emby-input" type="text" id="pickerSearch" class="jpk-check-list-search" placeholder="Search series..." />
            </div>
            <div class="picker-summary" id="pickerSummary"></div>
            <div id="pickerList" class="jpk-check-list-body"></div>
            <div class="jpk-modal-button-row">
                <button is="emby-button" type="button" id="btnCancelPicker" class="raised jpk-modal-button">
                    <span>Cancel</span>
                </button>
                <button is="emby-button" type="button" id="btnConfirmPicker" class="raised button-submit jpk-modal-button">
                    <span>Save Selection</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Input Modal -->
    <div id="inputModal" class="jpk-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="inputModalTitle">
        <div class="jpk-dialog-content jpk-dialog-content-narrow">
            <button type="button" id="btnCloseInputModal" class="jpk-dialog-close" aria-label="Close">&times;</button>
            <h2 id="inputModalTitle" class="jpk-modal-title"></h2>
            <div class="jpk-modal-body">
                <div id="inputModalFields"></div>
            </div>
            <div class="jpk-modal-button-row">
                <button is="emby-button" type="button" id="btnCancelInputModal" class="raised jpk-modal-button">
                    <span>Cancel</span>
                </button>
                <button is="emby-button" type="button" id="btnConfirmInputModal" class="raised button-submit jpk-modal-button">
                    <span>OK</span>
                </button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=ag_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=ag_shared.css">
</div>
