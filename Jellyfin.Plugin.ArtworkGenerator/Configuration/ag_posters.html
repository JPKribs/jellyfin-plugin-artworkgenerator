<div id="AgPostersPage" data-role="page" class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/ag_posters.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="AgPostersForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Poster Designs</h1>
                    </div>

                    <!-- Config Selector -->
                    <div class="base-selector">
                        <select is="emby-select" id="selectPosterConfig" class="base-selector-dropdown" aria-label="Design"></select>
                        <div class="base-selector-actions">
                            <button is="emby-button" type="button" id="btnNewConfig" class="raised base-button primary" title="New">
                                <span class="material-icons" aria-hidden="true">add</span>
                                <span>New</span>
                            </button>
                            <button is="emby-button" type="button" id="btnRenameConfig" class="raised base-button secondary" title="Rename">
                                <span class="material-icons" aria-hidden="true">edit</span>
                                <span>Rename</span>
                            </button>
                            <button is="emby-button" type="button" id="btnDeleteConfig" class="raised base-button destructive" title="Remove">
                                <span class="material-icons" aria-hidden="true">delete</span>
                                <span>Remove</span>
                            </button>
                            <button is="emby-button" type="button" id="btnImportConfig" class="raised base-button secondary" title="Import">
                                <span class="material-icons" aria-hidden="true">upload</span>
                                <span>Import</span>
                            </button>
                            <button is="emby-button" type="button" id="btnExportConfig" class="raised base-button secondary" title="Export">
                                <span class="material-icons" aria-hidden="true">download</span>
                                <span>Export</span>
                            </button>
                        </div>
                    </div>
                    <div id="designStatus" class="base-status-text" role="status"></div>

                    <!-- Live Preview -->
                    <div class="base-section">
                        <div class="base-section-title">Live Preview</div>
                        <div class="base-section-content">
                            <div class="ag-preview">
                                <div class="ag-preview-pair">
                                    <div class="ag-preview-shape">
                                        <div id="posterPreviewLandscape"></div>
                                        <div class="fieldDescription">Landscape</div>
                                    </div>
                                    <div class="ag-preview-shape ag-portrait">
                                        <div id="posterPreviewPortrait"></div>
                                        <div class="fieldDescription">Portrait</div>
                                    </div>
                                </div>
                                <div id="posterShapeNote" class="base-warn hidden" role="status"></div>
                                <div class="inputContainer">
                                    <label for="selectPreviewKind">Preview As</label>
                                    <select is="emby-select" id="selectPreviewKind" data-options="PreviewKind"></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Poster: always open, since the style picker drives everything below it -->
                    <div class="base-section">
                        <div class="base-section-title">Poster</div>
                        <div id="posterContent" class="base-section-content">

                            <div class="inputContainer">
                                <label for="selectPosterStyle"></label>
                                <select is="emby-select" id="selectPosterStyle" data-setting="PosterStyle" data-default="Standard"></select>
                                <div id="posterStyleDescription" class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectTextPosition"></label>
                                <select is="emby-select" id="selectTextPosition" data-setting="TextPosition" data-default="Auto"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectTextAlignment"></label>
                                <select is="emby-select" id="selectTextAlignment" data-setting="TextAlignment" data-default="Auto"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="base-indent" data-style-group id="frameOptions">
                                <div class="checkboxContainer checkboxContainer-withDescription">
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="chkLoneLineFollowsTitle" data-setting="LoneLineFollowsTitle" />
                                        <span class="checkboxLabel"></span>
                                    </label>
                                    <div class="fieldDescription checkboxFieldDescription"></div>
                                </div>
                            </div>

                            <div class="base-indent" data-style-group id="outlineOptions">
                                <div class="checkboxContainer checkboxContainer-withDescription">
                                    <label class="emby-checkbox-label">
                                        <input is="emby-checkbox" type="checkbox" id="chkCutoutBorder" data-setting="CutoutBorder" />
                                        <span class="checkboxLabel"></span>
                                    </label>
                                    <div class="fieldDescription checkboxFieldDescription"></div>
                                </div>
                            </div>

                            <div class="base-indent" data-style-group id="cutoutOptions">
                                <div class="inputContainer">
                                    <label for="selectCutoutType"></label>
                                    <select is="emby-select" id="selectCutoutType" data-setting="CutoutType" data-default="Code"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="base-indent" data-style-group id="logoOptions">
                                <div class="inputContainer">
                                    <label for="selectLogoAlignment"></label>
                                    <select is="emby-select" id="selectLogoAlignment" data-setting="LogoAlignment" data-default="Center"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="selectLogoPosition"></label>
                                    <select is="emby-select" id="selectLogoPosition" data-setting="LogoPosition" data-default="Center"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="txtLogoHeight"></label>
                                    <input is="emby-input" type="number" id="txtLogoHeight" min="1.0" max="100.0" data-setting="LogoHeight" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Canvas -->
                    <div class="base-collapsible-section">
                        <button type="button" class="base-collapsible-header collapsed" aria-expanded="false" aria-controls="canvasContent" data-target="canvasContent">
                            <span class="base-collapsible-title">Canvas</span>
                            <span class="base-collapsible-icon"></span>
                        </button>
                        <div id="canvasContent" class="base-collapsible-content collapsed">

                            <div class="inputContainer">
                                <label for="selectCanvasSource"></label>
                                <select is="emby-select" id="selectCanvasSource" data-setting="CanvasSource" data-default="Extract"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div id="gridOptions" class="base-indent">
                                <div class="inputContainer">
                                    <label for="txtGridFrames"></label>
                                    <input is="emby-input" type="number" id="txtGridFrames" min="2" max="16" step="1" data-setting="GridFrames" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="txtGridGap"></label>
                                    <input is="emby-input" type="number" id="txtGridGap" min="0" max="25" step="0.5" data-setting="GridGap" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectPosterFill"></label>
                                <select is="emby-select" id="selectPosterFill" data-setting="PosterFill" data-default="Original"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer" id="landscapeRatioField">
                                <label for="txtPosterDimensionRatio"></label>
                                <input is="emby-input" type="text" id="txtPosterDimensionRatio" placeholder="16:9" data-setting="PosterDimensionRatio" />
                            </div>
                            <div class="inputContainer">
                                <label for="txtPortraitDimensionRatio"></label>
                                <input is="emby-input" type="text" id="txtPortraitDimensionRatio" placeholder="2:3" data-setting="PortraitDimensionRatio" />
                                <div id="ratioNote" class="fieldDescription">The shape each image is cropped to, such as 16:9 for landscape and 2:3 for portrait.</div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtPosterSafeArea"></label>
                                <input is="emby-input" type="number" id="txtPosterSafeArea" min="1.0" max="100.0" data-setting="PosterSafeArea" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtElementSpacing"></label>
                                <input is="emby-input" type="number" id="txtElementSpacing" min="0" max="20" step="0.5" data-setting="ElementSpacing" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Overlay -->
                    <div class="base-collapsible-section">
                        <button type="button" class="base-collapsible-header collapsed" aria-expanded="false" aria-controls="overlayContent" data-target="overlayContent">
                            <span class="base-collapsible-title">Overlay</span>
                            <span class="base-collapsible-icon"></span>
                        </button>
                        <div id="overlayContent" class="base-collapsible-content collapsed">

                            <div class="checkboxContainer checkboxContainer-withDescription">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkPaletteDerivedColors" data-setting="PaletteDerivedColors" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div class="ag-field">
                                <label for="txtOverlayColor" data-color-label="Overlay Color" data-opacity-label="Overlay Opacity">Overlay Color</label>
                                <div data-color-field data-palette-aware>
                                        <input type="hidden" id="txtOverlayColor" data-setting="OverlayColor" data-fallback="#66000000" />
                                    </div>
                                <div id="descOverlayColor" class="fieldDescription" data-color-desc="ARGB hex color for the overlay." data-opacity-desc="How strongly the episode's dominant color tints the poster. The color itself comes from the image.">ARGB hex color for the overlay.</div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectOverlayGradient"></label>
                                <select is="emby-select" id="selectOverlayGradient" data-setting="OverlayGradient" data-default="None"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div id="secondaryOverlay" class="base-indent">
                                <div class="ag-field">
                                    <label for="txtOverlaySecondaryColor" data-color-label="Secondary Overlay Color" data-opacity-label="Secondary Overlay Opacity">Secondary Overlay Color</label>
                                    <div data-color-field data-palette-aware>
                                        <input type="hidden" id="txtOverlaySecondaryColor" data-setting="OverlaySecondaryColor" data-fallback="#66000000" />
                                    </div>
                                    <div id="descOverlaySecondaryColor" class="fieldDescription" data-color-desc="ARGB hex color for the gradient end." data-opacity-desc="Opacity of the gradient end, drawn as a darker shade of the same dominant color.">ARGB hex color for the gradient end.</div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Static Graphic -->
                    <div class="base-collapsible-section">
                        <button type="button" class="base-collapsible-header collapsed" aria-expanded="false" aria-controls="graphicContent" data-target="graphicContent">
                            <span class="base-collapsible-title">Static Graphic</span>
                            <span class="base-collapsible-icon"></span>
                        </button>
                        <div id="graphicContent" class="base-collapsible-content collapsed">

                            <div class="inputContainer">
                                <label for="txtGraphicPath"></label>
                                <input is="emby-input" type="text" id="txtGraphicPath" placeholder="/path/to/graphic.png" data-setting="GraphicPath" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div id="graphicOptions" class="base-indent" data-style-group>
                                <div class="inputContainer">
                                    <label for="selectGraphicPosition"></label>
                                    <select is="emby-select" id="selectGraphicPosition" data-setting="GraphicPosition" data-default="Center"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="selectGraphicAlignment"></label>
                                    <select is="emby-select" id="selectGraphicAlignment" data-setting="GraphicAlignment" data-default="Center"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="txtGraphicSize"></label>
                                    <input is="emby-input" type="number" id="txtGraphicSize" min="1.0" max="100.0" data-setting="GraphicSize" data-type="number" />
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Title -->
                    <div class="base-collapsible-section">
                        <button type="button" class="base-collapsible-header collapsed" aria-expanded="false" aria-controls="episodeTitleContent" data-target="episodeTitleContent">
                            <span class="base-collapsible-title">Title</span>
                            <span class="base-collapsible-icon"></span>
                        </button>
                        <div id="episodeTitleContent" class="base-collapsible-content collapsed">

                            <div id="primaryStyleNote" class="fieldDescription ag-section-note"></div>

                            <div class="checkboxContainer checkboxContainer-withDescription" id="showTitleRow">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkShowPrimary" data-setting="ShowPrimary" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div id="primaryOptions">
                            <div class="inputContainer">
                                <label for="selectLongTextHandling"></label>
                                <select is="emby-select" id="selectLongTextHandling" data-setting="LongTextHandling" data-default="Ellipsis"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="checkboxContainer checkboxContainer-withDescription">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkPrimaryUseCustomFont" data-setting="PrimaryUseCustomFont" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div id="primaryFontPath" class="inputContainer">
                                <label for="txtPrimaryFontPath"></label>
                                <input is="emby-input" type="text" id="txtPrimaryFontPath" placeholder="/path/to/font.ttf" data-setting="PrimaryFontPath" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div id="primaryFontPicker">
                                <div class="inputContainer">
                                    <label for="selectPrimaryFontFamily"></label>
                                    <select is="emby-select" id="selectPrimaryFontFamily" data-setting="PrimaryFontFamily" data-default="Montserrat">
                                        <option value="Montserrat">Montserrat</option>
                                        <option value="Arial">Arial</option>
                                        <option value="Arial Black">Arial Black</option>
                                        <option value="Book Antiqua">Book Antiqua</option>
                                        <option value="Calibri">Calibri</option>
                                        <option value="Cambria">Cambria</option>
                                        <option value="Candara">Candara</option>
                                        <option value="Century Gothic">Century Gothic</option>
                                        <option value="Comic Sans MS">Comic Sans MS</option>
                                        <option value="Consolas">Consolas</option>
                                        <option value="Courier New">Courier New</option>
                                        <option value="Didot">Didot</option>
                                        <option value="Franklin Gothic Medium">Franklin Gothic Medium</option>
                                        <option value="Futura">Futura</option>
                                        <option value="Garamond">Garamond</option>
                                        <option value="Georgia">Georgia</option>
                                        <option value="Gill Sans">Gill Sans</option>
                                        <option value="Helvetica">Helvetica</option>
                                        <option value="Impact">Impact</option>
                                        <option value="Lucida Console">Lucida Console</option>
                                        <option value="Lucida Sans Unicode">Lucida Sans Unicode</option>
                                        <option value="Monaco">Monaco</option>
                                        <option value="Optima">Optima</option>
                                        <option value="Palatino Linotype">Palatino Linotype</option>
                                        <option value="Rockwell">Rockwell</option>
                                        <option value="Segoe UI">Segoe UI</option>
                                        <option value="Tahoma">Tahoma</option>
                                        <option value="Times New Roman">Times New Roman</option>
                                        <option value="Trebuchet MS">Trebuchet MS</option>
                                        <option value="Verdana">Verdana</option>
                                    </select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="selectPrimaryFontStyle"></label>
                                    <select is="emby-select" id="selectPrimaryFontStyle" data-setting="PrimaryFontStyle" data-default="Bold"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtPrimaryFontSize"></label>
                                <input is="emby-input" type="number" id="txtPrimaryFontSize" min="1.0" max="100.0" data-setting="PrimaryFontSize" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="ag-field">
                                <label for="txtPrimaryFontColor"></label>
                                <div data-color-field>
                                        <input type="hidden" id="txtPrimaryFontColor" data-setting="PrimaryFontColor" data-fallback="#FFFFFFFF" />
                                    </div>
                                <div id="descPrimaryFontColor" class="fieldDescription">ARGB hex color for the title text.</div>
                            </div>
                            </div>

                        </div>
                    </div>

                    <!-- Subtitle -->
                    <div class="base-collapsible-section">
                        <button type="button" class="base-collapsible-header collapsed" aria-expanded="false" aria-controls="episodeInfoContent" data-target="episodeInfoContent">
                            <span class="base-collapsible-title">Subtitle</span>
                            <span class="base-collapsible-icon"></span>
                        </button>
                        <div id="episodeInfoContent" class="base-collapsible-content collapsed">

                            <div id="secondaryStyleNote" class="fieldDescription ag-section-note"></div>

                            <div class="checkboxContainer checkboxContainer-withDescription" id="showEpisodeRow">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkShowSecondary" data-setting="ShowSecondary" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div id="secondaryOptions">
                            <div class="checkboxContainer checkboxContainer-withDescription">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkHideRepeatedSubtitle" data-setting="HideRepeatedSubtitle" data-default-unchecked />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div class="inputContainer">
                                <label for="selectLongSubtitleHandling"></label>
                                <select is="emby-select" id="selectLongSubtitleHandling" data-setting="LongSubtitleHandling" data-default="ShortCode"></select>
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="checkboxContainer checkboxContainer-withDescription">
                                <label class="emby-checkbox-label">
                                    <input is="emby-checkbox" type="checkbox" id="chkSecondaryUseCustomFont" data-setting="SecondaryUseCustomFont" />
                                    <span class="checkboxLabel"></span>
                                </label>
                                <div class="fieldDescription checkboxFieldDescription"></div>
                            </div>

                            <div id="secondaryFontPath" class="inputContainer">
                                <label for="txtSecondaryFontPath"></label>
                                <input is="emby-input" type="text" id="txtSecondaryFontPath" placeholder="/path/to/font.ttf" data-setting="SecondaryFontPath" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div id="secondaryFontPicker">
                                <div class="inputContainer">
                                    <label for="selectSecondaryFontFamily"></label>
                                    <select is="emby-select" id="selectSecondaryFontFamily" data-setting="SecondaryFontFamily" data-default="Montserrat">
                                        <option value="Montserrat">Montserrat</option>
                                        <option value="Arial">Arial</option>
                                        <option value="Arial Black">Arial Black</option>
                                        <option value="Book Antiqua">Book Antiqua</option>
                                        <option value="Calibri">Calibri</option>
                                        <option value="Cambria">Cambria</option>
                                        <option value="Candara">Candara</option>
                                        <option value="Century Gothic">Century Gothic</option>
                                        <option value="Comic Sans MS">Comic Sans MS</option>
                                        <option value="Consolas">Consolas</option>
                                        <option value="Courier New">Courier New</option>
                                        <option value="Didot">Didot</option>
                                        <option value="Franklin Gothic Medium">Franklin Gothic Medium</option>
                                        <option value="Futura">Futura</option>
                                        <option value="Garamond">Garamond</option>
                                        <option value="Georgia">Georgia</option>
                                        <option value="Gill Sans">Gill Sans</option>
                                        <option value="Helvetica">Helvetica</option>
                                        <option value="Impact">Impact</option>
                                        <option value="Lucida Console">Lucida Console</option>
                                        <option value="Lucida Sans Unicode">Lucida Sans Unicode</option>
                                        <option value="Monaco">Monaco</option>
                                        <option value="Optima">Optima</option>
                                        <option value="Palatino Linotype">Palatino Linotype</option>
                                        <option value="Rockwell">Rockwell</option>
                                        <option value="Segoe UI">Segoe UI</option>
                                        <option value="Tahoma">Tahoma</option>
                                        <option value="Times New Roman">Times New Roman</option>
                                        <option value="Trebuchet MS">Trebuchet MS</option>
                                        <option value="Verdana">Verdana</option>
                                    </select>
                                    <div class="fieldDescription"></div>
                                </div>
                                <div class="inputContainer">
                                    <label for="selectSecondaryFontStyle"></label>
                                    <select is="emby-select" id="selectSecondaryFontStyle" data-setting="SecondaryFontStyle" data-default="Bold"></select>
                                    <div class="fieldDescription"></div>
                                </div>
                            </div>

                            <div class="inputContainer">
                                <label for="txtSecondaryFontSize"></label>
                                <input is="emby-input" type="number" id="txtSecondaryFontSize" min="1.0" max="100.0" data-setting="SecondaryFontSize" data-type="number" />
                                <div class="fieldDescription"></div>
                            </div>

                            <div class="ag-field">
                                <label for="txtSecondaryFontColor"></label>
                                <div data-color-field>
                                        <input type="hidden" id="txtSecondaryFontColor" data-setting="SecondaryFontColor" data-fallback="#FFFFFFFF" />
                                    </div>
                                <div id="descSecondaryFontColor" class="fieldDescription">ARGB hex color for the subtitle.</div>
                            </div>
                            </div>

                        </div>
                    </div>

                    <div id="saveBarHost"></div>

                </div>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=ag_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=ag_shared.css">
</div>
