overview: "Generate Custom Episode Posters"
description: >
  Artwork Generator is a Jellyfin plugin that creates episode posters, series and season posters, thumbs, backdrops, and text logos using frame extraction and custom overlay rendering. Utilizes brightness and sharpness scoring to avoid dark scenes and motion blur.
category: "MoviesAndShows"
