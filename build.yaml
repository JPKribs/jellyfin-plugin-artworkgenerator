# Keep single and double quote characters out of this file, changelog entries included. The
# release workflows pass these values through the shell and into the manifest, and quotes mangle
# the result. A colon followed by a space inside a changelog entry does the same, because YAML
# reads that entry as a key and a value.
name: Artwork Generator
guid: b8715e44-6b77-4c88-9c74-2b6f4c7b9a1e
imageUrl: https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-artworkgenerator/refs/heads/master/Jellyfin.Plugin.ArtworkGenerator/Assets/Logo.png
version: "12.4.6.1"
targetAbi: 12.4.0.0
framework: net10.0
overview: Generate artwork from your own video
description: >
  Artwork Generator draws posters, thumbs, backdrops, and text logos for series, seasons, episodes, films, any other video, collections, and folders, extracting frames from the item itself and rendering them through designs you control.
category: MoviesAndShows
owner: JPKribs
artifacts:
- Jellyfin.Plugin.ArtworkGenerator.dll
changelog:
  fixed:
  - Previews in Edit Images flickered as they first loaded, because the browser could download each one twice and show the card empty in between. Each preview is cached by the browser, so it loads once
  developer:
  - GET Plugins/ArtworkGenerator/Generated/{token} answers with Cache-Control private, max-age=86400, immutable, since a token only ever names one image
