# Keep single and double quote characters out of this file, changelog entries included. The
# release workflows pass these values through the shell and into the manifest, and quotes mangle
# the result. A colon followed by a space inside a changelog entry does the same, because YAML
# reads that entry as a key and a value.
name: Artwork Generator
guid: b8715e44-6b77-4c88-9c74-2b6f4c7b9a1e
imageUrl: https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-artworkgenerator/refs/heads/master/Jellyfin.Plugin.ArtworkGenerator/Assets/Logo.png
version: "12.4.4.0"
targetAbi: 12.4.0.0
framework: net10.0
overview: Generate artwork from your own video
description: >
  Artwork Generator draws posters, thumbs, backdrops, and text logos for series, seasons, episodes, films, any other video, collections, folders, and libraries, extracting frames from the item itself and rendering them through designs you control.
category: MoviesAndShows
owner: JPKribs
artifacts:
- Jellyfin.Plugin.ArtworkGenerator.dll
changelog:
  features:
  - Videos Per Parent in Frame Extraction caps how many videos a series, season, collection, folder, or library takes frames from. 0 uses every video and is the default. A lower number is faster on network storage
  fixed:
  - Logo text cleanup no longer fails on a busy server
  - Design and logo previews release their images when the page closes
  developer:
  - Built for Jellyfin 12.4 (target ABI 12.4.0.0).
  - Built with JPKribs.Jellyfin.Base 2026.10.28.
