# Keep single and double quote characters out of this file, changelog entries included. The
# release workflows pass these values through the shell and into the manifest, and quotes mangle
# the result. A colon followed by a space inside a changelog entry does the same, because YAML
# reads that entry as a key and a value.
name: Artwork Generator
guid: b8715e44-6b77-4c88-9c74-2b6f4c7b9a1e
imageUrl: https://raw.githubusercontent.com/JPKribs/jellyfin-plugin-artworkgenerator/refs/heads/master/Jellyfin.Plugin.ArtworkGenerator/Assets/Logo.png
version: "12.4.4.4"
targetAbi: 12.4.0.0
framework: net10.0
overview: Generate artwork from your own video
description: >
  Artwork Generator draws posters, thumbs, backdrops, and text logos for series, seasons, episodes, films, any other video, collections, folders, and libraries, extracting frames from the item itself and rendering them through designs you control.
category: MoviesAndShows
owner: JPKribs
artifacts:
- Jellyfin.Plugin.ArtworkGenerator.dll
changelog:
  changed:
  - Every tab takes the JPKribs.Jellyfin.Base 2026.11.17 look, and results show beside the Save button or the picker rather than in a popup
  - Remove replaces Delete on the Designs, Logos, and Profiles pickers, and Import comes before Export
  - Names are checked in the New and Rename dialogs before they close
  - The logo preview shows the logo over a Dark, Light, or Checkered background
  - Assigned items on the Profiles tab sit under a tab for each kind and are picked with a library search that shows their artwork
  - The Images table on the Profiles tab is a grid for each image, under the tabs Primary, Thumb, Logo, and Backdrop, and an image's design choices show once Generate is on
  - Every tab saves through the Base Save Bar, which says when there are unsaved changes and marks a field that is out of range
  - The Designs tab lists its sample images under the previews, and each opens larger when selected
  - The Logos tab names the Sample Name box and shows the artwork a sampled color comes from as a card under it
  - Color settings use the Base color picker with its opacity box. When Palette Colors or Color From sampling is on, only an opacity slider shows, in percent
  fixed:
  - The arrows on collapsible sections are back to their usual size
  developer:
  - Uses JPKribs.Jellyfin.Base 2026.11.17, whose record selector, buttons, Preview Frame, Media Picker, Media Card, List, Matrix Grid, Sub Tabs, Save Bar, validation, prompt and confirm dialogs, change tracker, indent, callout, and status text replace the hand built versions
  - Fields show and hide through Base's bindReveal and setVisible, and a hidden field is disabled so Base's validation skips it
  - ag_shared.css holds only layout between Base components
  - ag_shared.js holds the tab list and is the one module that imports Base
  - Plugin classes carry the ag- prefix
  - Adds starthere.md, agent.md, and the guides in skills
